<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tuotepassi</title>
<meta name="robots" content="noindex">
<meta property="og:type" content="website">
<meta property="og:title" content="Digitaalinen tuotepassi">
<meta property="og:description" content="EU:n digitaalinen tuotepassi — materiaalit, hoito-ohjeet ja kierrätystieto.">
<meta property="og:site_name" content="Digitaalinen tuotepassi">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Digitaalinen tuotepassi">
<meta name="twitter:description" content="EU:n digitaalinen tuotepassi — materiaalit, hoito-ohjeet ja kierrätystieto.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<style>
.eu-badge {
  display: inline-flex; align-items: center; gap: var(--sp-2);
  font-family: var(--font-mono); font-size: var(--text-xs); letter-spacing: .05em;
  color: var(--c-text-3); background: var(--c-surface-2);
  border: 1px solid var(--c-border); border-radius: 999px;
  padding: .25rem .65rem; margin-bottom: var(--sp-3);
}
.pp-type {
  font-family: var(--font-mono); font-size: var(--text-xs); letter-spacing: .06em;
  text-transform: uppercase; color: var(--c-text-3); margin-bottom: var(--sp-2);
}
.pp-lang {
  display: flex; align-items: center; gap: var(--sp-2);
  margin-bottom: var(--sp-4); flex-wrap: wrap;
}
.pp-lang label { font-size: var(--text-xs); color: var(--c-text-3); }
.pp-lang select {
  font-family: var(--font-sans); font-size: var(--text-sm);
  padding: .35rem 1.8rem .35rem .6rem; border: 1px solid var(--c-border);
  border-radius: var(--r); background: var(--c-surface-1); color: var(--c-text-1);
  cursor: pointer; max-width: 100%;
}
</style>
</head>
<body>
<div class="page" id="app">
  <p class="msg msg--mute">Ladataan...</p>
</div>
<script src="/passport-i18n.js"></script>
<script>
function setMeta(property, content) {
  const el = document.querySelector(`meta[property="${property}"]`) ||
             document.querySelector(`meta[name="${property}"]`);
  if (el) el.setAttribute('content', content);
}

let CURRENT_PRODUCT = null;

async function main() {
  const match = location.pathname.match(/^\/p\/([^/]+)\/?$/);
  const slug = match ? match[1] : '';
  const app = document.getElementById('app');
  if (!slug) {
    app.innerHTML = '<p class="msg msg--err">Virheellinen tuotelinkki.</p>';
    return;
  }
  let res;
  try { res = await fetch(`/api/public/product/${encodeURIComponent(slug)}`); }
  catch { app.innerHTML = '<p class="msg msg--err">Virhe yhteydessä.</p>'; return; }
  if (!res.ok) { app.innerHTML = '<p class="msg msg--err">Tuotetta ei löytynyt.</p>'; return; }
  const p = await res.json();
  CURRENT_PRODUCT = p;
  const pageTitle = (p.product_name || 'Tuotepassi') + ' – Digitaalinen tuotepassi';
  const pageDesc = [
    p.brand_name, p.product_name,
    'EU:n digitaalinen tuotepassi — materiaalit, hoito-ohjeet ja kierrätystieto.'
  ].filter(Boolean).join(' · ');
  document.title = pageTitle;
  setMeta('og:title', pageTitle);
  setMeta('og:description', pageDesc);
  setMeta('twitter:title', pageTitle);
  setMeta('twitter:description', pageDesc);
  setMeta('og:url', location.href);
  renderPassport(app, p, pickLang(p));
}

// Resolve the active language: ?lang= (if it has a translation) else original (fi).
function pickLang(p) {
  const translations = PassportI18n.parseTranslations(p.translations_json);
  const requested = new URLSearchParams(location.search).get('lang');
  return PassportI18n.resolveLang(requested, translations);
}

// Called by the language selector. Keeps the URL shareable (?lang=xx) without
// changing product identity, and re-renders in place.
function changeLang(code) {
  const url = new URL(location.href);
  if (code && code !== PassportI18n.ORIGINAL_LANG) url.searchParams.set('lang', code);
  else url.searchParams.delete('lang');
  history.replaceState(null, '', url);
  renderPassport(document.getElementById('app'), CURRENT_PRODUCT, pickLang(CURRENT_PRODUCT));
}

function esc(str) {
  return String(str ?? '').replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function parseList(json) {
  try { const v = JSON.parse(json || '[]'); return Array.isArray(v) ? v : []; }
  catch { return []; }
}

function formatDate(str, locale) {
  if (!str) return '';
  try {
    const d = new Date(str.includes('T') ? str : str.replace(' ', 'T') + 'Z');
    return d.toLocaleDateString(locale || 'fi-FI', { year: 'numeric', month: 'long', day: 'numeric' });
  } catch { return str; }
}

function dataRow(lbl, val) {
  const empty = !val || val === 'null' || val === '-';
  return `<div class="data-row">
    <span class="data-lbl">${esc(lbl)}</span>
    <span class="data-val${empty ? ' data-val--empty' : ''}">${esc(empty ? '—' : val)}</span>
  </div>`;
}

function section(title, body) {
  if (!body.trim()) return '';
  return `<div class="section"><div class="section-head">${esc(title)}</div><div>${body}</div></div>`;
}

function listSection(title, items) {
  if (!items.length) return '';
  return section(title,
    `<ul class="data-list">${items.map(i => `<li>${esc(i)}</li>`).join('')}</ul>`);
}

function renderPassport(app, p, lang) {
  document.documentElement.lang = lang;
  const translations = PassportI18n.parseTranslations(p.translations_json);
  const tr = translations[lang] || {};
  const T = (k) => PassportI18n.ui(lang, k);

  const name     = PassportI18n.tval(p, tr, 'product_name');
  const brand    = PassportI18n.tval(p, tr, 'brand_name');
  const mfrName  = PassportI18n.tval(p, tr, 'manufacturer_name') || p.manufacturer_name || '';
  const mfrMail  = p.manufacturer_email || '';
  const mfrAddr  = p.manufacturer_address || '';
  const opName   = PassportI18n.tval(p, tr, 'responsible_operator_name') || p.responsible_operator_name || '';
  const opMail   = p.responsible_operator_email || '';
  const opAddr   = p.responsible_operator_address || '';
  const prodType = PassportI18n.tval(p, tr, 'product_type') || p.product_type || '';

  const materials   = PassportI18n.tlist(parseList(p.materials_json),              tr, 'materials');
  const substances  = parseList(p.substances_json);
  const care        = PassportI18n.tlist(parseList(p.care_instructions_json),      tr, 'care_instructions');
  const repair      = PassportI18n.tlist(parseList(p.repair_instructions_json),    tr, 'repair_instructions');
  const recycling   = PassportI18n.tlist(parseList(p.recycling_instructions_json), tr, 'recycling_instructions');
  const safety      = PassportI18n.tlist(parseList(p.safety_notes_json),           tr, 'safety_notes');

  const mfrSection = (mfrName || mfrMail || mfrAddr)
    ? section(T('manufacturer'),
        (mfrName ? dataRow(T('name'), mfrName) : '') +
        (mfrMail ? dataRow(T('email'), mfrMail) : '') +
        (mfrAddr ? dataRow(T('address'), mfrAddr) : ''))
    : '';

  const opSection = (opName || opMail || opAddr)
    ? section(T('operator'),
        (opName ? dataRow(T('name'), opName) : '') +
        (opMail ? dataRow(T('email'), opMail) : '') +
        (opAddr ? dataRow(T('address'), opAddr) : ''))
    : '';

  const euBadge = (p.compliance_status === 'complete' || p.compliance_status === 'verified')
    ? `<span class="eu-badge">${esc(T('euOk'))}</span>`
    : '';

  // Language selector: original + languages that actually have a translation record.
  const langs = PassportI18n.availableLanguages(translations);
  const langSelector = langs.length > 1
    ? `<div class="pp-lang">
        <label for="pp-lang-select">${esc(T('language'))}</label>
        <select id="pp-lang-select" aria-label="${esc(T('language'))}">
          ${langs.map(l => `<option value="${esc(l.code)}"${l.code === lang ? ' selected' : ''}>${esc(l.name)}</option>`).join('')}
        </select>
      </div>`
    : '';

  app.innerHTML = `
    <div class="system-badge">${esc(T('badge'))}</div>
    ${langSelector}

    <div class="pp-header">
      ${euBadge}
      <h1 class="pp-name">${esc(name)}</h1>
      ${brand ? `<p class="pp-brand">${esc(brand)}</p>` : ''}
    </div>

    ${prodType ? `<p class="pp-type">${esc(prodType)}</p>` : ''}
    ${mfrSection}
    ${opSection}
    ${listSection(T('materials'), materials)}
    ${listSection(T('substances'), substances)}
    ${listSection(T('care'), care)}
    ${listSection(T('repair'), repair)}
    ${listSection(T('recycling'), recycling)}
    ${listSection(T('safety'), safety)}

    <div class="pp-footer">
      <div class="pp-footer-item">
        <span class="f-lbl">${esc(T('published'))}</span>
        <span class="f-val">${esc(formatDate(p.published_at || p.updated_at || p.created_at, lang))}</span>
      </div>
    </div>
  `;

  const sel = document.getElementById('pp-lang-select');
  if (sel) sel.addEventListener('change', (e) => changeLang(e.target.value));
}

main();
</script>
</body>
</html>
